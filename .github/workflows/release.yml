name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git branch -r --contains ${{ github.ref_name }} | grep -q 'origin/master' || \
          (echo "Tag ${{ github.ref_name }} is not on master branch. Aborting." && exit 1)

      - name: Set up Go
        uses: jdx/mise-action@v5

      - name: Install rpm build tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build release artifacts
        run: make packages

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            pulse-remote_*.tar.gz
            pulse-remote_*_amd64.deb
            pulse-remote-*.x86_64.rpm
            checksums.txt
